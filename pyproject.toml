[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "education-rag"
version = "0.1.0"
description = "CLI foundation for the Education RAG project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-community>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL instance",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".pytest_cache", ".codex-pytest-tmp", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
